name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Verify and build
        run: |
          bash -n install.sh scripts/build-release.sh
          python3 -m unittest discover -s tests -v
          go vet ./...
          go build -o mx .
          bash scripts/build-release.sh
          mkdir -p /tmp/mx-smoke
          tar -xzf dist/mx_linux_amd64.tar.gz -C /tmp/mx-smoke mx
          /tmp/mx-smoke/mx --help
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" dist/mx_*.tar.gz dist/SHA256SUMS --verify-tag --title "$RELEASE_TAG" --generate-notes
